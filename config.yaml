universe: mixed  # sample | blue | futures | mixed
data_source: moex
lookback_days: 500
equity: 1000000
risk_per_trade: 0.01
max_positions: 8
mr_capital_pct: 0.12
strategies:
- RaynerBB_MeanRev
- ConnorsRSI2
- TrendBreakout_200High
- Donchian20
- EMA_Pullback
- Rayner_BOS_MTF
- Rayner_FalseBreak
plugins_dir: plugins
news:
  enabled: true
  sources:
  - google
  - rbc
  - interfax
  - finam
  - smartlab
  - kommersant
  - rss
  min_sentiment: -0.35
  lookback_days: 5
telegram:
  enabled: true
  title: Rayner × MOEX Scanner
api_keys:
  finnhub: ''
output:
  console: true
  csv: true
strategy_params:
  RaynerBB_MeanRev:
    bb_std: 2.5
    limit_pct: 0.03
  ConnorsRSI2:
    rsi_entry: 10


monitor:
  enabled: true
  interval_minutes: 30
  session_start: "10:00"
  session_end: "18:50"
  universe: mixed
  no_news: true

journal:
  enabled: true
  auto_open: true
  telegram_on_close: true

ml:
  enabled: false
  mode: rank
  min_probability: 0.55
  model_path: ml/artifacts/model.json


# Rayner alignment filters
rayner_filters:
  require_aov_for_pa: true
  min_rr: 1.5
  market_filter: true          # IMOEX above SMA200 for stock longs
  market_ticker: IMOEX
  market_sma: 200
  tf_trail_only: true          # trend strategies: no aggressive 1R scale-out
